<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">Your Random Ringtone</title>
  <desc id="desc">Neon feature graphic with a smartphone, sound waves and a music note.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17102F"/>
      <stop offset="0.52" stop-color="#24143F"/>
      <stop offset="1" stop-color="#0C132B"/>
    </linearGradient>
    <linearGradient id="neon" x1="90" y1="430" x2="910" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF78B8"/>
      <stop offset="0.5" stop-color="#B86BFF"/>
      <stop offset="1" stop-color="#7CFFB2"/>
    </linearGradient>
    <linearGradient id="screen" x1="110" y1="90" x2="260" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#292052"/>
      <stop offset="1" stop-color="#151832"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#background)"/>
  <ellipse cx="550" cy="252" rx="430" ry="180" fill="#7B4BD1" opacity=".12" filter="url(#softGlow)"/>

  <!-- Decorative audio waves in the background. -->
  <g fill="none" stroke-linecap="round" opacity=".22">
    <path d="M0 356 C140 260 250 430 390 332 S650 220 790 322 S920 400 1024 300" stroke="#B86BFF" stroke-width="3"/>
    <path d="M0 392 C130 300 246 458 384 364 S650 255 792 354 S920 432 1024 330" stroke="#7CFFB2" stroke-width="2"/>
  </g>

  <!-- Compact smartphone illustration. -->
  <g filter="url(#glow)">
    <rect x="84" y="58" width="188" height="386" rx="36" fill="#17172F" stroke="url(#neon)" stroke-width="8"/>
    <rect x="99" y="73" width="158" height="356" rx="25" fill="url(#screen)" stroke="#B86BFF" stroke-opacity=".28" stroke-width="3"/>
    <rect x="154" y="86" width="48" height="8" rx="4" fill="#090B1D"/>
    <path d="M119 252h22l12-42 20 84 18-60 14 31h34" fill="none" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="178" cy="401" r="8" fill="none" stroke="#7CFFB2" stroke-width="3"/>
  </g>

  <!-- Ringtone waves around the centered message. -->
  <g fill="none" stroke="url(#neon)" stroke-linecap="round" filter="url(#glow)">
    <path d="M340 164 C390 204 390 296 340 336" stroke-width="11" opacity=".9"/>
    <path d="M388 122 C460 182 460 318 388 378" stroke-width="9" opacity=".72"/>
    <path d="M820 150 C870 190 870 282 820 322" stroke-width="10" opacity=".8"/>
  </g>

  <!-- Center-safe slogan area. -->
  <rect x="294" y="156" width="532" height="174" rx="36" fill="#0B0D22" opacity=".58" stroke="#B86BFF" stroke-opacity=".24" stroke-width="2"/>
  <text x="560" y="230" text-anchor="middle" fill="white" font-family="Calibri" font-size="44" font-weight="700" letter-spacing="-0.5">Your Random Ringtone</text>
  <text x="560" y="282" text-anchor="middle" fill="#DCCBFF" font-family="Calibri" font-size="31" font-weight="400" letter-spacing=".2">from your music pool</text>

  <!-- One clean music note on the right. -->
  <g fill="url(#neon)" filter="url(#glow)">
    <rect x="878" y="92" width="16" height="126" rx="8"/>
    <path d="M890 92h72v25l-72 17z"/>
    <ellipse cx="858" cy="224" rx="30" ry="20" transform="rotate(-12 858 224)"/>
  </g>

  <circle cx="325" cy="92" r="6" fill="#7CFFB2"/>
  <circle cx="934" cy="392" r="6" fill="#FF78B8"/>
  <path d="M744 68l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#7CFFB2" filter="url(#glow)"/>
</svg>
