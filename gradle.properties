org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Stable software rendering for local Gradle Managed Devices on Windows.
# Without this, some emulator versions select the unsupported auto-no-window mode.
android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
