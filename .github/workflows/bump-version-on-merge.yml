name: Bump version and create Android release

on:
  pull_request:
    types:
      - closed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-version-master
  cancel-in-progress: false

jobs:
  bump-version-and-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump app version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          version_code_match = re.search(r"versionCode = (\d+)", text)
          version_name_match = re.search(r'versionName = "(\d+)\.(\d+)\.(\d+)"', text)

          if not version_code_match or not version_name_match:
              raise SystemExit("Could not find versionCode/versionName in app/build.gradle.kts")

          new_version_code = int(version_code_match.group(1)) + 1
          major, minor, patch = map(int, version_name_match.groups())
          new_version_name = f"{major}.{minor}.{patch + 1}"

          text = re.sub(r"versionCode = \d+", f"versionCode = {new_version_code}", text, count=1)
          text = re.sub(
              r'versionName = "\d+\.\d+\.\d+"',
              f'versionName = "{new_version_name}"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          Path(".release-version").write_text(new_version_name, encoding="utf-8")
          print(f"versionCode -> {new_version_code}")
          print(f"versionName -> {new_version_name}")
          PY

      - name: Commit version bump and create tag
        id: release_tag
        shell: bash
        run: |
          VERSION_NAME="$(cat .release-version)"
          TAG_NAME="v${VERSION_NAME}"
          git add app/build.gradle.kts
          git commit -m "ci: bump app version to ${VERSION_NAME} [skip ci]"

          if git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists."
            exit 1
          fi

          git tag "${TAG_NAME}"
          git push origin HEAD:master
          git push origin "${TAG_NAME}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Validate release secrets
        shell: bash
        env:
          ZK_STORE_FILE_B64: ${{ secrets.ZK_STORE_FILE_B64 }}
          ZK_STORE_PASSWORD: ${{ secrets.ZK_STORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          for name in ZK_STORE_FILE_B64 ZK_STORE_PASSWORD ZK_KEY_ALIAS ZK_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Restore keystore from secret
        env:
          ZK_STORE_FILE_B64: ${{ secrets.ZK_STORE_FILE_B64 }}
        run: echo "${ZK_STORE_FILE_B64}" | base64 --decode > keystore.jks

      - name: Create keystore.properties
        env:
          ZK_STORE_PASSWORD: ${{ secrets.ZK_STORE_PASSWORD }}
          ZK_KEY_ALIAS: ${{ secrets.ZK_KEY_ALIAS }}
          ZK_KEY_PASSWORD: ${{ secrets.ZK_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=${ZK_STORE_PASSWORD}
          keyAlias=${ZK_KEY_ALIAS}
          keyPassword=${ZK_KEY_PASSWORD}
          EOF

      - name: Run unit tests
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed APK
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Build signed app bundle
        run: bash ./gradlew --no-daemon bundleRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing files
        if: always()
        run: rm -f keystore.jks keystore.properties .release-version
